services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: wallet_api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: ${PORT:-3011}
      NODE_ENV: ${NODE_ENV:-production}
      AUTH_MODE: ${AUTH_MODE:-telegram}
      HOST: 0.0.0.0
      BOT_TOKEN: ${BOT_TOKEN:-${TELEGRAM_BOT_TOKEN:-}}
      OWNER_TELEGRAM_ID: ${OWNER_TELEGRAM_ID:-${INITIAL_OWNER_TELEGRAM_ID:-}}
      APP_ORIGIN: ${APP_ORIGIN:-https://wallet.y3110w.com}
      MINI_APP_URL: ${MINI_APP_URL:-${APP_ORIGIN:-https://wallet.y3110w.com}}
      NUTRITION_APP_URL: ${NUTRITION_APP_URL:-}
      TASKS_APP_URL: ${TASKS_APP_URL:-}
      NUTRITION_LLM_PROVIDER: ${NUTRITION_LLM_PROVIDER:-claude}
      NUTRITION_LLM_MODEL: ${NUTRITION_LLM_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PHOTO_STORAGE_DIR: /data/photos
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://wallet.y3110w.com,http://localhost:3012,http://localhost:5173}
    ports:
      - "${PORT:-3011}:${PORT:-3011}"
    volumes:
      # Meal photos are kept forever: include this volume in backups.
      - nutrition_photos:/data/photos
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - homelab_net

  web:
    build:
      context: .
      dockerfile: docker/mini-app.Dockerfile
      args:
        APP: web
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api-wallet.y3110w.com}
    container_name: wallet_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3012}:80"
    depends_on:
      - api
    networks:
      - default
      - homelab_net

  nutrition-web:
    build:
      context: .
      dockerfile: docker/mini-app.Dockerfile
      args:
        APP: nutrition-web
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api-wallet.y3110w.com}
    container_name: nutrition_web
    restart: unless-stopped
    ports:
      - "${NUTRITION_WEB_PORT:-3013}:80"
    depends_on:
      - api
    networks:
      - default
      - homelab_net

  tasks-web:
    build:
      context: .
      dockerfile: docker/mini-app.Dockerfile
      args:
        APP: tasks-web
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api-wallet.y3110w.com}
    container_name: tasks_web
    restart: unless-stopped
    ports:
      - "${TASKS_WEB_PORT:-3014}:80"
    depends_on:
      - api
    networks:
      - default
      - homelab_net

volumes:
  postgres_data:
  nutrition_photos:

networks:
  homelab_net:
    external: true
