services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: wallet_api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: ${PORT:-3011}
      NODE_ENV: ${NODE_ENV:-production}
      AUTH_MODE: ${AUTH_MODE:-telegram}
      HOST: 0.0.0.0
      BOT_TOKEN: ${BOT_TOKEN:-${TELEGRAM_BOT_TOKEN:-}}
      OWNER_TELEGRAM_ID: ${OWNER_TELEGRAM_ID:-${INITIAL_OWNER_TELEGRAM_ID:-}}
      APP_ORIGIN: ${APP_ORIGIN:-https://wallet.y3110w.com}
      MINI_APP_URL: ${MINI_APP_URL:-${APP_ORIGIN:-https://wallet.y3110w.com}}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://wallet.y3110w.com,http://localhost:3012,http://localhost:5173}
    ports:
      - "${PORT:-3011}:${PORT:-3011}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - homelab_net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api-wallet.y3110w.com}
    container_name: wallet_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3012}:80"
    depends_on:
      - api
    networks:
      - default
      - homelab_net

volumes:
  postgres_data:

networks:
  homelab_net:
    external: true
